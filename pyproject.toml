[project]
name = "car-assistant-bot"
version = "0.1.0"
description = "Telegram bot for car owners with VIN decoding and AI assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21.0,<22.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "pydantic-settings>=2.3.0"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
